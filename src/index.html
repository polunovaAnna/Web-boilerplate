<!doctype html>
<html lang="en">
  <head itemscope itemtype="http://schema.org/WebSite">
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Teachhinder</title>

    <link rel="stylesheet" href="./css/app.css" />
  </head>

  <body itemscope itemtype="http://schema.org/WebPage">
    <script type="text/javascript" src="./js/app.js"></script>

    <header>
      <h1 class="logo">Teachinder</h1>
      <div class="header-search">
        <input
          type="text"
          class="search-input"
          placeholder="Name, note or age to search"
        />
        <button type="button" class="search-button">Search</button>
      </div>
    </header>
    <nav>
      <ul class="nav-pages">
        <li><a href="#teachers" class="nav-link">Teachers</a></li>
        <li><a href="#statistics" class="nav-link">Statistics</a></li>
        <li><a href="#favorites" class="nav-link">Favorites</a></li>
        <li><a href="#about" class="nav-link">About</a></li>
      </ul>
      <button type="button" class="nav-add">Add teacher</button>
    </nav>

    <hr class="divider" />

    <div class="top-teachers">
      <h1 class="top-teachers-title">Top Teachers</h1>
      <div class="filters">
        <div class="filter-group">
          <label class="filter-group-title">Age</label>
          <select class="filter-group-select">
            <option value="18-31">18-31</option>
            <option value="31-45">31-45</option>
            <option value="45+">45+</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-group-title">Region</label>
          <select class="filter-group-select">
            <option value="Europe">Europe</option>
            <option value="North America">North America</option>
            <option value="Asia">Asia</option>
            <option value="South America">South America</option>
            <option value="Africa">Africa</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-group-title">Sex</label>
          <select class="filter-group-select">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="filter-group">
          <input
            type="checkbox"
            class="filter-group-checkbox"
            id="photo-filter"
          />
          <label class="filter-group-title">Only with photo</label>
        </div>
        <div class="filter-group">
          <input
            type="checkbox"
            class="filter-group-checkbox"
            id="favorites-filter"
          />
          <label class="filter-group-title">Only favorites</label>
        </div>
      </div>
      <div class="top-teachers-list"></div>
    </div>

    <hr class="divider" />
  </body>
</html>
